<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf7ef" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="今日待办" />
    <title>今日待办 · Daily Calm</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('todo-app:theme')
          var resolved
          if (stored === 'custom') {
            var css = localStorage.getItem('todo-app:custom-theme-css')
            if (css) {
              var style = document.createElement('style')
              style.id = 'custom-theme-style'
              style.textContent = css
              document.head.appendChild(style)
            }
            resolved = 'custom'
          } else if (stored === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'fresh'
          } else {
            var ids = [
              'fresh',
              'dark',
              'songlv',
              'bishan',
              'tianshuibi',
              'xiaowu',
              'tuihong',
              'taoyao',
              'qiubo',
              'qianyun',
              'mingyue',
              'violet',
            ]
            resolved = ids.indexOf(stored) >= 0 ? stored : 'fresh'
          }
          document.documentElement.dataset.theme = resolved
        } catch (error) {
          document.documentElement.dataset.theme = 'fresh'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
