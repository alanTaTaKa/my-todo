    <meta
      name="description"
      content="清新治愈的待办应用：免注册、本地优先、离线可用，登录后免费云同步；26 套主题陪你一件一件慢慢来。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="今日待办 · Daily Calm" />
    <meta
      property="og:description"
      content="把日子，过成慢慢来的样子。清新治愈的待办应用，免注册即可使用。"
    />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary" />
    <title>今日待办 · Daily Calm</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('todo-app:theme')
          var resolved
          if (stored === 'custom') {
            var css = localStorage.getItem('todo-app:custom-theme-css')
            if (css) {
              var style = document.createElement('style')
              style.id = 'custom-theme-style'
              style.textContent = css
              document.head.appendChild(style)
            }
            resolved = 'custom'
          } else if (stored === 'system') {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'fresh'
          } else {
            var ids = [
              'fresh',
              'dark',
              'songlv',
              'bishan',
              'tianshuibi',
              'xiaowu',
              'tuihong',
              'taoyao',
              'qiubo',
              'qianyun',
              'mingyue',
              'violet',
              'qingdai',
              'yanzhi',
              't486',
              'silverelf',
              'younv',
              'redoni',
              'blueoni',
              'greed',
              'sunprincess',
              'songmo',
              'fox',
              't6154',
              'jiahu',
              'god',
            ]
            resolved = ids.indexOf(stored) >= 0 ? stored : 'fresh'
          }
          document.documentElement.dataset.theme = resolved
        } catch (error) {
          document.documentElement.dataset.theme = 'fresh'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
