services:
  db:
    image: postgres:16-alpine
    container_name: daily-calm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: daily_calm
    ports:
      - "5432:5432"
    volumes:
      - daily_calm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d daily_calm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  daily_calm_pgdata:
